# ============================================================
# Fly.io - RCUMC Normalização Acadêmica
# ------------------------------------------------------------
# API com LibreOffice para conversão fiel do modelo DOCX->PDF.
# ============================================================

app = "rcumc-normalizacao-academica"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
