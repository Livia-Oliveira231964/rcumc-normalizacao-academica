# fly.toml app configuration file generated for rcumcnormalizacao-academia on 2026-11-24T17:16:36-03:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'rcumcnormalizacao-academia'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  HOSTNAME = '0.0.0.0'
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = '1gb'
  cpus = 1
